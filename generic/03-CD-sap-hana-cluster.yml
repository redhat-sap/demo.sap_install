---
# Phase 3 - steps C and D
#
# Configures SAP HANA System Replication and a Pacemaker HA cluster.
#
# Roles (community.sap_install collection):
#   - sap_ha_install_hana_hsr
#   - sap_ha_pacemaker_cluster
#
# Example with SBD fencing variables:
#   ansible-playbook generic/03-CD-sap-hana-cluster.yml \
#     -e @vars/generic/vars.cluster-sbd.example
#
#  vars:
#    sap_domain: example.com
#
#    sap_hana_sid: 'RHA'
#    sap_hana_instance_number: '00'
#    sap_hana_install_master_password: 'my_hana_password'
#    # It is recommended to use vault instead of plain text passwords. See README.
#
#    ### Cluster definition
#    sap_ha_pacemaker_cluster_cluster_name: hanacluster
#    sap_ha_pacemaker_cluster_hacluster_user_password: 'my_hacluster'
#
#    sap_hana_cluster_nodes:
#      - node_name: hana1
#        node_ip: "{{ hostvars['hana1'].ansible_host }}"
#        node_role: primary
#        hana_site: DC01
#
#      - node_name: hana2
#        node_ip: "{{ hostvars['hana2'].ansible_host }}"
#        node_role: secondary
#        hana_site: DC02
#
#    sap_ha_pacemaker_cluster_vip_hana_primary_ip_address: 10.0.0.200
#
#    ### SBD fencing (disk-based, shared storage)
#    # Use the same stable /dev/disk/by-id/ path on both cluster nodes.
#    _sbd_devices: /dev/disk/by-id/scsi-3600c0ff00aa11bb22
#
#    sap_ha_pacemaker_cluster_sbd_enabled: true
#    sap_ha_pacemaker_cluster_sbd_devices:
#      - "{{ _sbd_devices }}"
#
#    sap_ha_pacemaker_cluster_sbd_watchdog_modules:
#      - softdog
#
#    # RHEL: stonith:fence_sbd requires the devices parameter on the STONITH resource.
#    sap_ha_pacemaker_cluster_stonith_custom:
#      - agent: stonith:fence_sbd
#        id: stonith_sbd
#        instance_attrs:
#          - attrs:
#              - name: devices
#                value: "{{ _sbd_devices }}"
#              - name: pcmk_delay_max
#                value: 15
#
#    # SLES: use stonith:external/sbd instead (devices only in sap_ha_pacemaker_cluster_sbd_devices):
#    # sap_ha_pacemaker_cluster_stonith_custom:
#    #   - agent: stonith:external/sbd
#    #     id: stonith_sbd
#    #     instance_attrs:
#    #       - attrs:
#    #           - name: pcmk_delay_max
#    #             value: 15

- name: "Phase 03-C and 03-D - Setup HANA System Replication and Pacemaker cluster"
  hosts: "{{ group_hana | d('hanas') }}"
  become: true

  roles:
    - community.sap_install.sap_ha_install_hana_hsr
    - community.sap_install.sap_ha_pacemaker_cluster
